name: CI

on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches:
      - develop
      - "feature/**"
      - "fix/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  POSTGRES_DB: finance
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: synthetic-ci-password
  OPENAI_API_KEY: not-used

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-mcp-server.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          LANGGRAPH_POSTGRES_URI: "postgresql://unused:unused@localhost/unused"
        run: python -m pytest -q

  kubernetes:
    name: Docker and Kubernetes integration
    runs-on: ubuntu-latest
    needs: python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Kustomize manifests
        run: |
          kubectl kustomize k8s/ >/dev/null
          kubectl kustomize k8s/overlays/test/ >/dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: finance-ai-agent:v8
          cache-from: type=gha,scope=ci-production
          cache-to: type=gha,mode=max,scope=ci-production

      - name: Build synthetic test image
        run: docker build -f Dockerfile.test -t finance-ai-agent:v8-test .

      - name: Create ephemeral kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: finance-ai-ci
          wait: 120s

      - name: Load local images into kind
        run: |
          kind load docker-image finance-ai-agent:v8 --name finance-ai-ci
          kind load docker-image finance-ai-agent:v8-test --name finance-ai-ci

      - name: Deploy synthetic Kubernetes stack
        run: kubectl apply -k k8s/overlays/test/

      - name: Wait for Kubernetes resources
        run: |
          kubectl rollout status deployment/postgres \
            -n finance-ai --timeout=180s
          kubectl wait --for=condition=complete \
            job/finance-ai-database-setup \
            -n finance-ai --timeout=240s
          kubectl rollout status deployment/finance-ai-api \
            -n finance-ai --timeout=300s

      - name: Run health and synthetic TechNova tests
        run: |
          set -euo pipefail
          kubectl port-forward service/finance-ai-api 8000:8000 \
            -n finance-ai >/tmp/finance-ai-port-forward.log 2>&1 &
          port_forward_pid=$!
          trap 'kill "$port_forward_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health \
              >/tmp/finance-ai-health.json; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/finance-ai-port-forward.log
              exit 1
            fi
            sleep 1
          done

          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(Path("/tmp/finance-ai-health.json").read_text())
          assert health == {"status": "ok"}, health
          PY

          curl --fail --silent --show-error \
            -X POST http://127.0.0.1:8000/agent/chat \
            -H 'Content-Type: application/json' \
            -d '{"thread_id":"ci-k8s-test","message":"Combien TechNova nous doit-il ?"}' \
            >/tmp/finance-ai-agent.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/finance-ai-agent.json").read_text())
          answer = payload.get("answer", "").replace("\u00a0", " ")
          assert payload.get("status") == "completed", payload
          assert "5 800" in answer, answer
          assert "2 factures impayées" in answer, answer
          PY

      - name: Kubernetes diagnostics
        if: failure()
        run: |
          kubectl get all -n finance-ai || true
          kubectl get pvc -n finance-ai || true
          kubectl get endpointslices -n finance-ai || true
          kubectl describe pods -n finance-ai || true
          for pod in $(kubectl get pods -n finance-ai \
            -l app.kubernetes.io/component=api -o name 2>/dev/null); do
            kubectl logs -n finance-ai "$pod" --all-containers=true \
              --prefix=true || true
          done
          kubectl logs -n finance-ai \
            -l app.kubernetes.io/component=database-setup \
            --all-containers=true --prefix=true || true
          kubectl logs -n finance-ai \
            -l app.kubernetes.io/component=postgres \
            --all-containers=true --prefix=true || true

      - name: Delete ephemeral kind cluster
        if: always()
        run: |
          if command -v kind >/dev/null 2>&1; then
            kind delete cluster --name finance-ai-ci
          fi
