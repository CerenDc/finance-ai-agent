apiVersion: batch/v1
kind: Job
metadata:
  name: finance-ai-database-setup
  labels:
    app.kubernetes.io/name: finance-ai
    app.kubernetes.io/component: database-setup
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finance-ai
        app.kubernetes.io/component: database-setup
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: finance-ai-agent:v8
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: finance-ai-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-ai-secrets
                  key: POSTGRES_PASSWORD
          command: ["python", "-c"]
          args:
            - |
              import os, time
              import psycopg
              uri = f"postgresql://{os.environ['POSTGRES_USER']}:{os.environ['POSTGRES_PASSWORD']}@postgres:5432/{os.environ['POSTGRES_DB']}"
              for attempt in range(60):
                  try:
                      with psycopg.connect(uri, connect_timeout=3):
                          raise SystemExit(0)
                  except psycopg.OperationalError:
                      time.sleep(2)
              raise SystemExit("PostgreSQL did not become ready within 120 seconds")
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
      containers:
        - name: setup
          image: finance-ai-agent:v8
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: finance-ai-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finance-ai-secrets
                  key: POSTGRES_PASSWORD
          command: ["sh", "-ec"]
          args:
            - |
              export DATABASE_URL="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
              export LANGGRAPH_POSTGRES_URI="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
              python -m app.db.seed
              python -m app.agent.finance_graph --setup
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
